name: Verify and Package VINOVATE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o vinovate .

      - name: Stage distributable project
        run: |
          mkdir -p dist/VINOVATE/private-apks
          cp -R main.go go.mod catalog.json templates static Dockerfile README.md dist/VINOVATE/
          printf 'Place release APK files here. This directory is intentionally outside /static.\n' > dist/VINOVATE/private-apks/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VINOVATE-Go-Store
          path: dist/VINOVATE
          if-no-files-found: error
