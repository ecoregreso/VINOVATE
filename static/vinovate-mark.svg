<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VINOVATE V leaf mark</title>
  <desc id="desc">A blue V with a green leaf accent inside a circular halo.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e4ef"/>
      <stop offset="0.45" stop-color="#20cfff"/>
      <stop offset="1" stop-color="#0a4fc8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#17c875"/>
      <stop offset="0.55" stop-color="#35ed72"/>
      <stop offset="1" stop-color="#8cff55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#blue)" stroke-width="12" opacity="0.72"/>
  <path d="M86 104h92l92 230 64-150h88L301 421h-85z" fill="url(#blue)" filter="url(#glow)"/>
  <path d="M297 236c27-96 81-159 151-180-8 85-50 145-129 181 35-53 66-88 98-119-45 26-82 65-120 118z" fill="url(#green)" filter="url(#glow)"/>
  <path d="M315 278c42-54 82-79 122-79-13 61-50 101-110 117 28-29 53-50 78-68-32 11-61 22-90 30z" fill="url(#green)"/>
</svg>
